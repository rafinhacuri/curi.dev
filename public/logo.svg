<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26272c" />
      <stop offset="1" stop-color="#050506" />
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#6d8dff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#6d8dff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="skull" cx="0.38" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.6" stop-color="#f2f2f4" />
      <stop offset="1" stop-color="#c9cad1" />
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d26" />
      <stop offset="1" stop-color="#07080c" />
    </linearGradient>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#tile)" />
  <rect width="512" height="512" rx="114" fill="url(#halo)" />
  <line x1="282" y1="150" x2="292" y2="96" stroke="#5b5e6a" stroke-width="12" stroke-linecap="round" />
  <circle cx="293" cy="88" r="20" fill="#6d8dff" filter="url(#glow)" />
  <rect x="62" y="252" width="46" height="100" rx="18" fill="#5b5e6a" />
  <rect x="404" y="252" width="46" height="100" rx="18" fill="#5b5e6a" />
  <ellipse cx="256" cy="302" rx="178" ry="150" fill="url(#skull)" />
  <ellipse cx="256" cy="310" rx="146" ry="104" fill="url(#visor)" />
  <ellipse cx="226" cy="264" rx="70" ry="30" fill="#ffffff" fill-opacity="0.07" />
  <g fill="#8aa3ff" filter="url(#glow)">
    <rect x="186" y="266" width="40" height="76" rx="20" />
    <rect x="286" y="266" width="40" height="76" rx="20" />
  </g>
</svg>
